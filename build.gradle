plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        testClient {
            parent runs.client
            workingDirectory project.file('run')
            property 'lanterna.autotest', 'true'
            property 'lanterna.autotest.scene', project.findProperty('scene') ?: 'full'
            property 'lanterna.tropas', project.findProperty('tropas') ?: 'green,red,yellow,blue,violet,indigo,orange,black,white'
            property 'lanterna.planetas', project.findProperty('planetas') ?: 'oa,korugar,ysmault,odym,okaara,nok,zamaron,ryut'
            if (project.findProperty('refazer')) property 'lanterna.refazer', 'true'
            if (project.findProperty('cidadeUnica')) property 'lanterna.cidadeUnica', 'true'
            if (project.findProperty('lugar')) property 'lanterna.lugar', project.findProperty('lugar')
            if (project.findProperty('forma')) property 'lanterna.forma', project.findProperty('forma')
            if (project.findProperty('dbgbroca')) property 'lanterna.dbgbroca', 'true'
            args '--quickPlaySingleplayer', (project.findProperty('mundo') ?: 'test'), '--width', (project.findProperty('largura') ?: '960'), '--height', (project.findProperty('altura') ?: '540')
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    // GeckoLib (modelos animados dos alienígenas)
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    // Simple Voice Chat (só a API, para compilar; o mod em si o jogador instala)
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    // JEI (só a API, para compilar a integração opcional)
    maven { url = 'https://maven.blamejared.com/' }
}

configurations {
    // bibliotecas que vão dentro do .jar do mod (o Vosk: reconhecimento de fala offline)
    embutir
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Vosk (fala -> texto, offline). O JNA já vem com o Minecraft.
    implementation('com.alphacephei:vosk:0.3.45') { transitive = false }
    minecraftLibrary('com.alphacephei:vosk:0.3.45') { transitive = false }
    embutir('com.alphacephei:vosk:0.3.45') { transitive = false }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.5.0'
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.74.0.234')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.74.0.234')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
    exclude 'com/lanterna/client/devtest/**'
    from({ configurations.embutir.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/maven/**'
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
